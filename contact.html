<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">

    <title>PAOLORBT</title>
</head>
<body>
    <main class="container">
        <div id="left">
            <div class="navbar">
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </div>
                
            <nav class="nav">
                <ul>
                    <li><a href="index.html">home</a></li>
                    <li><a href="graphic.html">graphics</a></li>
                    <li><a href="contact.html">contacts</a></li>
                </ul>
            </nav>
            <P id="nome-logo">
                paolo rbt
            </P>
            <div id="social">

            </div>
        </div>
        <div id="centro">
            <img src="pictures/me.jpg" alt="paolo rbt">
        </div>
        <div class="contact-container"; id="destra">
            <h1 class="quote">
                “Il est encore plus facile de juger de l'esprit d'un homme par ses questions que par ses réponses.”<br>
                <span class="autore">- Voltaire -</span>
            </h1>
            <div id="contact-intro">
                <p>Hai una domanda, un progetto da proporre o semplicemente vuoi salutarmi?<br>
                    Compila i campi qui sotto e ti risponderò il prima possibile.</p>

                <!-- L'attributo action invia i dati tramite FormSubmit alla tua email -->
                <form action="https://formsubmit.co/prpetrignani@gmail.com" method="POST">
                    
                    <!-- Campo Nome -->
                    <div class="form-group">
                        <label for="nome"></label>
                        <input type="text" id="nome" name="nome" placeholder="Chi sei?" required>
                    </div>

                    <!-- Campo Email -->
                    <div class="form-group">
                        <label for="email"></label>
                        <input type="email" id="email" name="email" placeholder="tua@email.com" required>
                    </div>

                    <!-- Campo Messaggio -->
                    <div class="form-group">
                        <label for="messaggio"></label>
                        <textarea id="messaggio" name="messaggio" placeholder="Come posso aiutarti?" required></textarea>
                    </div>

                    <!-- Opzioni extra nascoste per FormSubmit (facoltative) -->
                    <!-- Oggetto dell'email che riceverai -->
                    <input type="hidden" name="_subject" value="Nuovo messaggio dal sito web!">
                    <!-- Disattiva il captcha se preferisci un invio diretto -->
                    <input type="hidden" name="_captcha" value="false">

                    <!-- Pulsante di invio -->
                </form>
            </div>
            <button class="invia" type="submit" id="invia">Invia messaggio</button>
        </div>
    </main>
    <script src="scripts/menu.js"></script>
</body>
</html>
